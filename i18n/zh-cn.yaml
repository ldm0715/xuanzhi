# 宣纸主题 · 界面文案
#
# 主题自带的这份就能生效——Hugo 会合并主题与站点的 i18n 目录，
# 站点想改某个词，只需在自己的 i18n/zh-cn.yaml 里写同名 key 覆盖。
#
# 命名约定：扁平 camelCase；面板/首页/归档等成组的用前缀区分。
# 新增界面文案一律进这里，别在模板里硬编码中文。

