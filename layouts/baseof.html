<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}"
      data-theme="light"
      data-accent="{{ or site.Params.accent "terracotta" }}"
      data-copy="{{ i18n "copy" }}"
      data-copied="{{ i18n "copied" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body data-layout="{{ .Kind }}">
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
