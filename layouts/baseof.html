<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}"
      data-theme="light"
      data-accent="{{ or site.Params.accent "terracotta" }}"
      data-pagefind-index="{{ "pagefind/pagefind.js" | relURL }}"
      data-copy="{{ i18n "copy" }}"
      data-copied="{{ i18n "copied" }}"
      data-search-empty="{{ i18n "searchEmpty" }}"
      data-search-loading="{{ i18n "searchLoading" }}"
      data-search-error="{{ i18n "searchError" }}"
      data-search-unindexed="{{ i18n "searchUnindexed" }}"
      data-menu-open="{{ i18n "menuOpen" }}"
      data-menu-close="{{ i18n "menuClose" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body data-layout="{{ .Kind }}">
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
