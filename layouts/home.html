{{ define "main" -}}
{{ $pages := where site.RegularPages "Type" "in" site.MainSections -}}
{{ $paginator := .Paginate $pages 10 -}}
<section class="post-list">
  {{- range $paginator.Pages }}
  {{ partial "post-item.html" . }}
  {{- end }}
</section>
{{ partial "pagination.html" $paginator }}
{{- end }}
