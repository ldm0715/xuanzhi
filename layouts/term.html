{{ define "main" -}}
<div class="container">
<header class="page-heading">
  <h1>{{ i18n "tag" }}：{{ .Title }}</h1>
</header>
{{ $paginator := .Paginate .Pages -}}
<section class="post-list">
  {{- range $paginator.Pages }}
  {{ partial "post-item.html" . }}
  {{- end }}
</section>
{{ partial "pagination.html" $paginator }}
</div>
{{- end }}
