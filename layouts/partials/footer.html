<footer class="site-footer">
  <div class="container">
    <div class="footer-line">
      <span class="seal" aria-hidden="true">{{ substr site.Title 0 1 | default "宣" }}</span>
      <p>© {{ now.Format "2006" }} {{ site.Title }}</p>
      <nav class="footer-links">
        {{ with site.Home.OutputFormats.Get "rss" -}}
        <a href="{{ .RelPermalink }}" aria-label="{{ i18n "rssSubscribe" }}" title="{{ i18n "rssSubscribe" }}">
          {{/* 图标来源：@material-design-icons/svg (Apache 2.0) filled/rss_feed */}}
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <circle cx="6.18" cy="17.82" r="2.18"/>
            <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
          </svg>
        </a>
        {{ end -}}
      </nav>
    </div>
  </div>
</footer>
