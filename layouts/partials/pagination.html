{{- if gt .TotalPages 1 -}}
<nav class="pagination">
  {{- with .Prev }}
  <a class="pagination-prev" href="{{ .URL }}">← {{ i18n "prevPage" }}</a>
  {{- end }}
  <span class="pagination-num">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{- with .Next }}
  <a class="pagination-next" href="{{ .URL }}">{{ i18n "nextPage" }} →</a>
  {{- end }}
</nav>
{{- end -}}
