<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="site-nav">
      {{- with site.MainSections -}}
      {{- with site.GetPage (index . 0) -}}
      <a href="{{ .RelPermalink }}">{{ i18n "archive" }}</a>
      {{- end -}}
      {{- end -}}
      {{ with site.GetPage "tags" -}}
      <a href="{{ .RelPermalink }}">{{ i18n "tags" }}</a>
      {{- end }}
      <div class="appearance">
        <button type="button" id="appearance-toggle" aria-label="外观设置" aria-expanded="false" title="外观设置">
          {{/* 图标来源：@material-design-icons/svg (Apache 2.0) filled/palette */}}
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.528.528 0 0 1-.13-.33c0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm5.5 11c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm-3-4c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9zM5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S7.33 13 6.5 13 5 12.33 5 11.5zm6-4c0 .83-.67 1.5-1.5 1.5S8 8.33 8 7.5 8.67 6 9.5 6s1.5.67 1.5 1.5z"/>
          </svg>
        </button>
        <div id="appearance-panel" class="appearance-panel" hidden>
          <div class="panel-group">
            <span class="panel-label">背景</span>
            <div class="panel-options">
              <button type="button" data-bg="grid" aria-pressed="true"><span class="swatch swatch-grid"></span>稿纸格</button>
              <button type="button" data-bg="plain" aria-pressed="false"><span class="swatch swatch-plain"></span>素纸</button>
              <button type="button" data-bg="noise" aria-pressed="false"><span class="swatch swatch-noise"></span>噪点</button>
              <button type="button" data-bg="noise-vignette" aria-pressed="false"><span class="swatch swatch-noise swatch-vignette"></span>暗角</button>
              <button type="button" data-bg="ruled" aria-pressed="false"><span class="swatch swatch-ruled"></span>信笺</button>
            </div>
          </div>
          <div class="panel-group">
            <span class="panel-label">点缀色</span>
            <div class="panel-options">
              <button type="button" data-accent="terracotta" aria-pressed="true"><span class="swatch swatch-terracotta"></span>陶土橘</button>
              <button type="button" data-accent="indigo" aria-pressed="false"><span class="swatch swatch-indigo"></span>黛青</button>
            </div>
          </div>
          <div class="panel-group">
            <span class="panel-label">分隔线</span>
            <div class="panel-options">
              <button type="button" data-hr="ink" aria-pressed="true"><span class="swatch swatch-hr-ink"></span>一笔</button>
              <button type="button" data-hr="zhu" aria-pressed="false"><span class="swatch swatch-hr-zhu"></span>断栏</button>
              <button type="button" data-hr="dots" aria-pressed="false"><span class="swatch swatch-hr-dots"></span>墨点</button>
              <button type="button" data-hr="feibai" aria-pressed="false"><span class="swatch swatch-hr-feibai"></span>飞白</button>
            </div>
          </div>
        </div>
      </div>
      <button type="button" id="theme-toggle" aria-label="切换明暗模式" title="切换明暗模式">
        {{/* 图标来源：@material-design-icons/svg (Apache 2.0) filled/light_mode + filled/dark_mode */}}
        <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
