<?xml version="1.0" encoding="UTF-8"?>
<!-- 红杏出墙 · 山水画框卡封面预览稿(亮色调,固定种子)
     墙 = 一道瓦檐墨线 + 三条漏痕,墙面交给留白
     页面渲染由 layouts/partials/post-card-cover.html 按题哈希内联生成
     (种子随文、明暗跟随),改形状请两处同步 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" role="img" aria-label="红杏出墙">
  <rect width="390" height="260" fill="#FCFAF4"/>
  <defs>
    <filter id="pen" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.12" numOctaves="2" seed="173" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="rainp" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.2" numOctaves="2" seed="173" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </defs>
  <path d="M-30 146 Q90 140 204 145 Q212 146 212 153" fill="none" stroke="#26241F" stroke-width="4.5" stroke-linecap="round" filter="url(#pen)"/>
  <g fill="none" stroke="#8C877B" stroke-width="1.5" stroke-linecap="round" filter="url(#rainp)">
    <path d="M48 151 Q46 176 44 197" opacity="0.4"/>
    <path d="M128 150 Q131 172 129 194" opacity="0.35"/>
    <path d="M180 151 Q177 167 175 183" opacity="0.45"/>
  </g>
  <path d="M390 88 Q316 92 272 106 Q246 116 230 132" fill="none" stroke="#26241F" stroke-width="3" stroke-linecap="round" filter="url(#pen)"/>
  <path d="M272 106 Q258 106 248 112" fill="none" stroke="#3A3833" stroke-width="1.8" stroke-linecap="round" filter="url(#pen)"/>
  <g fill="#B25A46" filter="url(#pen)">
    <circle cx="302" cy="90" r="3.5" opacity="0.55"/>
    <circle cx="272" cy="105" r="4" opacity="0.7"/>
    <circle cx="248" cy="112" r="3" opacity="0.5"/>
    <circle cx="234" cy="136" r="4" opacity="0.7"/>
    <circle cx="218" cy="150" r="3.5" opacity="0.6"/>
    <circle cx="206" cy="164" r="3" opacity="0.45"/>
  </g>
</svg>
