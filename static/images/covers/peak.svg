<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" role="img" aria-label="云岫">
  <rect width="390" height="260" fill="#FCFAF4"/>
  <defs>
    <filter id="ink" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.02" numOctaves="3" seed="256" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30"/>
    </filter>
    <filter id="pen" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.12" numOctaves="2" seed="256" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <path d="M40 208 L150 84 Q160 72 172 86 L300 208 Z" fill="#8C877B" filter="url(#ink)" opacity="0.5"/>
  <path d="M196 208 L268 126 L352 208 Z" fill="#3A3833" filter="url(#ink)" opacity="0.35"/>
  <rect x="-30" y="148" width="450" height="28" fill="#8C877B" filter="url(#ink)" opacity="0.5"/>
  <path d="M92 70 Q99 62 106 70 Q113 62 120 70" fill="none" stroke="#26241F" stroke-width="2.2" stroke-linecap="round" filter="url(#pen)"/>
