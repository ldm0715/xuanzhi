<?xml version="1.0" encoding="UTF-8"?>
<!-- 孤舟远影 · 山水画框卡封面预览稿(亮色调,固定种子)
     页面渲染由 layouts/partials/post-card-cover.html 按题哈希内联生成
     (种子随文、明暗跟随),改形状请两处同步 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" role="img" aria-label="孤舟远影">
  <rect width="390" height="260" fill="#FCFAF4"/>
  <defs>
    <filter id="ink" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.02" numOctaves="3" seed="64" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30"/>
    </filter>
    <filter id="pen" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.12" numOctaves="2" seed="64" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <rect x="-30" y="148" width="450" height="26" fill="#8C877B" filter="url(#ink)" opacity="0.3"/>
  <rect x="-30" y="196" width="450" height="34" fill="#8C877B" filter="url(#ink)" opacity="0.45"/>
  <path d="M148 188 Q196 204 246 186" fill="none" stroke="#26241F" stroke-width="3" stroke-linecap="round" filter="url(#pen)"/>
  <path d="M176 184 Q196 166 216 184" fill="none" stroke="#3A3833" stroke-width="2.4" stroke-linecap="round" filter="url(#pen)"/>
  <line x1="182" y1="216" x2="228" y2="216" stroke="#8C877B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
