  </defs>
  <circle cx="308" cy="62" r="28" fill="#DA7756" opacity="0.14"/>
  <rect x="-30" y="142" width="450" height="55" fill="#8C877B" filter="url(#ink)" opacity="0.5"/>
  <rect x="-30" y="172" width="450" height="60" fill="#3A3833" filter="url(#ink)" opacity="0.55"/>
  <rect x="-30" y="208" width="450" height="70" fill="#26241F" filter="url(#ink)" opacity="0.85"/>
