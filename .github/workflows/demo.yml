name: demo

# 把 exampleSite/ 构建成主题演示站，发布到 GitHub Pages。
#
# 仓库 Settings → Pages → Build and deployment → Source 要选 **GitHub Actions**，
# 否则这个 workflow 跑完也不会发布。
#
# 演示站挂在自定义域的子路径下：https://blog.gcnanmu3125.cyou/xuanzhi/
# （GitHub Pages 会把 https://ldm0715.github.io/xuanzhi/ 301 过去。）
# 基础地址以 exampleSite/hugo.toml 的 baseURL 为准，本源仓库不覆盖；**只有 fork
# 出去的仓库**才按仓库名推导 github.io 地址——那个推导在本源仓库是错的，地址会
# 301 跳走，页面里的 canonical / sitemap / og:url 会跟着全指错。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的 push 顶掉排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 与 theme.toml 的 min_version 对齐
          hugo-version: '0.165.0'
          extended: true

      - name: Build demo
        # 本源仓库走 hugo.toml 里的自定义域地址；fork 出去的仓库没有那个自定义域，
        # 按仓库名推导 github.io 地址覆盖它——克隆下来直接部署，不用改配置。
        run: |
          if [ "${{ github.repository }}" = "ldm0715/xuanzhi" ]; then
            hugo --source exampleSite --minify
          else
            hugo --source exampleSite --minify \
              --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

      # 站内搜索（Pagefind）：在 hugo 构建后给 exampleSite/public 生成 /pagefind/ 索引，
      # 产物随 public 一起上传。没跑这一步，演示站搜索面板只会提示「索引未生成」。
      - name: Index with Pagefind
        run: npx --yes pagefind@latest --site exampleSite/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
